<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Заказ на Профи.ру</title>
<style>
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px;
         box-sizing: border-box; background: #fff; color: #111; }
  a { display: block; width: 100%; max-width: 320px; padding: 14px; border-radius: 12px; text-align: center;
      text-decoration: none; box-sizing: border-box; }
  #app { background: #111; color: #fff; }
  #web { border: 1px solid #ccc; color: #111; }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; } #app { background: #eee; color: #111; } #web { border-color: #555; color: #eee; }
  }
</style>
<p id="title">Заказ</p>
<a id="app">Открыть в приложении</a>
<a id="web">Открыть в браузере</a>
<script>
  // Telegram accepts only http(s) links, and the "Для профи" app opens an order only through
  // its own URL scheme, so cards link here and this page hands the order over to the app.
  var id = (location.search + location.hash).replace(/\D/g, "");
  var web = "https://profi.ru/backoffice/n.php?o=" + id;
  var app = "backoffice-react-app://&sub1=order&sub2=" + id;
  document.getElementById("title").textContent = id ? "Заказ № " + id : "Номер заказа не указан";
  document.getElementById("app").href = app;
  document.getElementById("web").href = web;
  if (id) {
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) location.href = app;
    else location.replace(web);
  }
</script>
</html>
